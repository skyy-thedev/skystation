# SkyStation: configuração do RetroArch (PS1). Regenerada a cada abertura pelo sky-emu.
# Prioridade: desempenho e estabilidade. Nada de filtros, shaders, rewind ou run-ahead.

# --- vídeo
video_driver = "gl"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_shader_enable = "false"
video_aspect_ratio_auto = "true"
video_font_enable = "false"

# --- áudio (PipeWire via camada Pulse)
audio_driver = "pulse"
audio_latency = "64"
audio_sync = "true"

# --- entrada (controles lidos direto do kernel, com mapeamento automático)
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
input_exit_emulator = "escape"
input_menu_toggle = "f1"

# --- interface mínima (o launcher é o SkyStation; o menu do RetroArch fica escondido)
menu_driver = "rgui"
pause_nonactive = "false"
config_save_on_exit = "false"
notification_show_autoconfig = "false"
notification_show_remap_load = "false"
fps_show = "false"

# --- recursos caros desligados
rewind_enable = "false"
run_ahead_enabled = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"

# --- pastas fixas e seguras
savefile_directory = "@SKY@/saves/ps1"
savestate_directory = "@SKY@/states/ps1"
system_directory = "@SKY@/bios/ps1"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
