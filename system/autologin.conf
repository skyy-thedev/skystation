# SkyStation: login automático do usuário "sky" no tty1, sem nenhum texto na tela.
# Instalado em /etc/systemd/system/getty@tty1.service.d/autologin.conf
#
# O primeiro "ExecStart=" vazio apaga o comando original do getty;
# o segundo o substitui pela versão com --autologin.
# --skip-login / --noissue / --nonewline: não imprime "sky login:" nem a mensagem do sistema.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --skip-login --noissue --nonewline --noclear --autologin sky %I $TERM
TTYVTDisallocate=no
